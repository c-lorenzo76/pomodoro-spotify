<div class="flex flex-col h-screen">
  <app-navbar [user]="user"></app-navbar>

  <div class="flex flex-1 overflow-hidden bg-[#121212]">
    <app-sidebar (playlistSelected)="onPlaylistSelected($event)" [playlists]="playlists"></app-sidebar>

    <div class="flex-1 overflow-y-auto">
      <div class="flex flex-col h-full w-full">
        <app-dashboard class="block flex-1" (playPlaylist)="onPlayPlaylist($event)"></app-dashboard>
      </div>
    </div>
  </div>

  <app-player [playlistUri]="selectedPlaylistUri" ></app-player>
</div>
