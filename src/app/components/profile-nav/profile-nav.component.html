<div class="bg-gradient-to-b from-[#2a2a2a] to-[#121212] px-4 sm:px-6 lg:px-8 pt-8 pb-6 text-white">
  <div class="flex flex-col md:flex-row md:items-end gap-5">
    <!-- Avatar -->
    <img *ngIf="user?.images?.length" [src]="user!.images[0].url" alt="Avatar"
      class="h-28 w-28 flex-shrink-0 rounded-full object-cover shadow-2xl shadow-black/50" />
    <div *ngIf="user && !user.images?.length"
      class="flex h-28 w-28 flex-shrink-0 items-center justify-center rounded-full bg-white/10 shadow-2xl shadow-black/50">
      <i class="pi pi-user text-gray-400" style="font-size: 2.5rem"></i>
    </div>
    <div *ngIf="!user" class="h-28 w-28 flex-shrink-0 rounded-full bg-white/10 animate-pulse"></div>

    <div class="min-w-0">
      <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Profile</span>

      <h1 *ngIf="user" class="mt-1 truncate text-3xl sm:text-4xl font-bold tracking-tight">{{ user.display_name }}</h1>
      <div *ngIf="!user" class="mt-2 h-8 w-48 rounded-md bg-white/10 animate-pulse"></div>

      <!-- Stats -->
      <div class="mt-4 flex flex-wrap items-center gap-3">
        <div class="rounded-xl bg-white/5 px-4 py-2 ring-1 ring-white/5">
          <span class="block text-xs font-semibold uppercase tracking-wider text-gray-400">Playlists</span>
          <!-- I'm going to have to change when viewing someones profile that it only shows the public ones -->
          <span *ngIf="playlists" class="mt-0.5 block text-lg font-bold tabular-nums">{{ playlists.total }}</span>
          <div *ngIf="!playlists" class="mt-1.5 h-5 w-10 rounded bg-white/10 animate-pulse"></div>
        </div>

        <div class="rounded-xl bg-white/5 px-4 py-2 ring-1 ring-white/5">
          <span class="block text-xs font-semibold uppercase tracking-wider text-gray-400">Followers</span>
          <span *ngIf="user" class="mt-0.5 block text-lg font-bold tabular-nums">{{ user.followers?.total ?? '—' }}</span>
          <div *ngIf="!user" class="mt-1.5 h-5 w-10 rounded bg-white/10 animate-pulse"></div>
        </div>

        <div class="rounded-xl bg-white/5 px-4 py-2 ring-1 ring-white/5">
          <span class="block text-xs font-semibold uppercase tracking-wider text-gray-400">Following</span>
          <span *ngIf="following" class="mt-0.5 block text-lg font-bold tabular-nums">{{ following.artists.total }}</span>
          <div *ngIf="!following" class="mt-1.5 h-5 w-10 rounded bg-white/10 animate-pulse"></div>
        </div>
      </div>
    </div>
  </div>
</div>
