<div class="bg-gray-100 p-4 h-full border-b-2">
  <div class="flex flex-col lg:flex-row lg:justify-between items-start">
    <div class="flex flex-col md:flex-row items-start">

      <img
        *ngIf="user"
        [ngSrc]="user.images[0].url"
        alt="Avatar"
        class="mr-5 mb-3 lg:mb-0 w-24 h-24 rounded-full"
        height="70" width="71"/>
      <p-skeleton *ngIf="!user" size="6rem" shape="circle"/>
      <div>
        <span *ngIf="user" class="text-gray-900 font-medium text-3xl">{{ user.display_name }}</span>
        <p-skeleton *ngIf="!user" width="10rem" height="2rem" class="mt-1"/>
<!--        <i class="pi pi-star text-2xl ml-4 text-yellow-500"></i>-->
        <div class="flex flex-wrap items-center text-sm mt-3">
          <div class="mr-5">
            <span class="font-medium text-gray-500">Playlists</span>
            <!-- I'm going to have to change when viewing someones profile that it only shows the public ones -->
            <div *ngIf="playlists" class="text-gray-600 mt-1">{{ playlists.total }}</div>
            <p-skeleton *ngIf="!playlists" class="mt-1" width="5rem" height="1.5rem"/>
          </div>
          <div class="mr-5">
            <span class="font-medium text-gray-500">Followers</span>
            <div *ngIf="user" class="text-gray-600 mt-1">{{ user.followers.total }}</div>
            <p-skeleton *ngIf="!user" class="mt-1" width="5rem" height="1.5rem"/>
          </div>
          <div class="mr-5">
            <span class="font-medium text-gray-500">Following</span>
            <div *ngIf="following" class="text-gray-600 mt-1">{{ following.artists.total }}</div>
            <p-skeleton *ngIf="!following" class="mt-1" width="5rem" height="1.5rem"/>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-3 lg:mt-0 flex space-x-2">
      <button
        class="flex justify-center items-center rounded-full bg-gray-200 text-gray-800 p-3  hover:bg-gray-300 transition"
        aria-label="Bookmark"
      >
        <i class="pi pi-bookmark"></i>
      </button>
      <button
        class="flex justify-center items-center rounded-full bg-green-500 text-white p-3 hover:bg-green-600 transition"
        aria-label="Heart"
      >
        <i class="pi pi-heart"></i>
      </button>
      <button
        class="flex justify-center items-center rounded-full bg-blue-500 text-white p-3 hover:bg-blue-600 transition"
        aria-label="List"
      >
        <i class="pi pi-list"></i>
      </button>
    </div>
  </div>

</div>
