<div class="bg-gray-100 border-4 border-blue p-4 h-full border-b-2">
  <div class="flex flex-col lg:flex-row lg:justify-between items-start">
    <div class="flex flex-col md:flex-row items-start">
      <img
        *ngIf="playlistSongs"
        [ngSrc]="playlistSongs.images[0].url"
        alt="Avatar"
        class="mr-5 mb-3 lg:mb-0 w-24 h-24 rounded-full"
        height="70" width="71"/>
      <p-skeleton *ngIf="!playlistSongs" size="6rem" shape="square"/>
      <div class="ml-2">
        <span *ngIf="playlistSongs?.public" class="text-gray-900 font-medium text-md">Public Playlist</span>
        <span *ngIf="!playlistSongs?.public" class="text-gray-900 font-medium text-md">Private Playlist</span>

        <span *ngIf="playlistSongs?.name" class="text-gray-900 font-medium text-3xl">{{ playlistSongs?.name }}</span>
        <p-skeleton *ngIf="!playlistSongs?.name" width="10rem" height="2rem" class="mt-1"/>

      </div>

    </div>
</div>
</div>
