<div class="w-full bg-gray-900 h-24 px-6 flex items-center justify-between text-white">

  <div class="flex items-center space-x-4 w-1/3">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 48 48">
      <path fill="#8bc34a" d="M24.001,4c-11.077,0-20,8.923-20,20s8.923,20,20,20c11.076,0,20-8.923,20-20S35.077,4,24.001,4z"></path>
      <path fill="#fff" d="M31.747,33.915c-0.292,0-0.585-0.145-0.877-0.292..."></path>
    </svg>
    <div class="text-sm">
      <p class="font-semibold text-white">Song name</p>
      <p class="text-xs text-gray-300">Artist</p>
    </div>
  </div>

  <div class="flex flex-col items-center justify-center w-1/3">
    <div class="flex space-x-6">
      <button class="hover:text-green-400">
        <i class="pi pi-step-backward"></i>
      </button>
      <button class="hover:text-green-500 text-xl">
        <i class="pi pi-play-circle"></i>
      </button>
      <button class="hover:text-green-400">
        <i class="pi pi-step-forward"></i>
      </button>
    </div>

    <div class="w-full flex items-center space-x-2 mt-2 text-xs text-gray-400">
      <span>0:00</span>
      <div class="h-1 bg-gray-700 w-full rounded">
        <div class="h-1 bg-green-500 w-1/3 rounded"></div>
      </div>
      <span>25:00</span>
    </div>
  </div>

  <div class="flex items-center justify-end space-x-4 w-1/3">
    <button class="relative hover:text-green-500 transition">
      <i class="pi pi-bars text-lg"></i>
    </button>
    <button class="relative hover:text-green-500 transition">
      <i class="pi pi-bell text-lg"></i>
      <span class="absolute -top-1 -right-1 bg-red-600 w-2 h-2 rounded-full"></span>
    </button>
  </div>
</div>
