<div class="w-full bg-[#121212] h-22 px-6 flex items-center justify-between text-white">

  <div class="flex items-center space-x-4">
    <!-- fix this the logo isn't showing -->
    <img src="Full_Logo_Green_RGB.svg" alt="Spotify Logo" class="h-8 w-auto" />
    <span>|</span>
    <span class="text-lg">Pomodoro</span>
    <button class="relative hover:text-green-500 transition">
      <i class="pi pi-home text-xl"></i>
    </button>
  </div>


  <div class="flex items-center space-x-4">
    <button class="relative hover:text-green-500 transition">
      <i class="pi pi-bell text-lg"></i> <!-- PrimeIcons bell -->

      <span class="absolute -top-1 -right-1 bg-red-600 w-2 h-2 rounded-full"></span>
    </button>

    <img
      *ngIf="user && user.images.length"
      [ngSrc]="user.images[0].url"
      width="32"
      height="32"
      alt="Profile Picture"
      class="rounded-full border border-gray-600"
    />
    <p-skeleton *ngIf="!user" shape="circle" size="2rem" />
  </div>
</div>
